name: Refresh job data

# Runs once a day at 03:30 IST (22:00 UTC). Free on public repositories.
# Note: GitHub disables scheduled workflows after ~60 days with no repository
# activity. If listings go stale, open the Actions tab and press "Run workflow".
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public job boards
        run: python3 pipeline/fetch_sources.py

      - name: Fetch government vacancies (NCS)
        run: python3 pipeline/fetch_ncs.py

      - name: Fetch employer career pages (pharma / hospitals)
        run: python3 pipeline/fetch_employers.py

      - name: Rebuild the site
        run: python3 build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "job-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json data/govt-live.json data/site-data.json index.html
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
